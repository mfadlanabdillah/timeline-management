[package]
name = "timeline-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "timeline_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rust_xlsxwriter = "0.79"
printpdf = "0.7"

[dev-dependencies]
tempfile = "3"
