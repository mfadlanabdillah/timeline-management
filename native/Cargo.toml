[package]
name = "po-timeline-native"
version = "0.1.0"
edition = "2021"
description = "PO Timeline — native Windows app (Slint, Fluent)"

[[bin]]
name = "po-timeline"
path = "src/main.rs"

[dependencies]
# Software renderer: ~30 MB RAM vs ~140 MB with the OpenGL (femtovg) renderer.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
timeline-core = { path = "../core" }
chrono = "0.4"
rfd = "0.15"
dirs = "6"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
